<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Doorstep Service - RideFix</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDyAqz5_6-i7xIlPAdMUBhdVCZwV262Prw",
    authDomain: "ridefix-final.firebaseapp.com",
    projectId: "ridefix-final",
    storageBucket: "ridefix-final.firebasestorage.app",
    messagingSenderId: "175554582400",
    appId: "1:175554582400:web:f40c9b80354d6963ab1365"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadService() {
    try {
      const q = query(collection(db, "services"), orderBy("position", "asc"));
      const snapshot = await getDocs(q);
      let services = [];
      snapshot.forEach(doc => services.push(doc.data()));
      
      if (services.length >= 1) {
        const service = services[0];
        document.getElementById('service-name').innerText = service.name || "Doorstep Service";
        document.getElementById('service-category').innerText = service.category || "DOORSTEP SERVICE";
        document.getElementById('service-image').src = service.image || "https://images.unsplash.com/photo-1558981806-ec527fa84c39?q=80&w=1200&auto=format&fit=crop";
        document.getElementById('service-price').innerText = service.price || "99";
        document.getElementById('service-description').innerHTML = service.description || "Professional doorstep repair service. We come to your home and fix your vehicle right in front of you.";
      }
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      setTimeout(() => lucide.createIcons(), 100);
    } catch(e) { console.error(e); }
  }
  
  window.bookService = function() {
    const phone = localStorage.getItem('ridefix_phone');
    if (!phone) { if(confirm("Please login to book this service?")) window.location.href='login2.html'; return; }
    window.location.href = 'booking.html';
  };
  
  document.addEventListener('DOMContentLoaded', loadService);
</script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  /* 🔥 टेक्स्ट कॉपी बंद 🔥 */
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  -khtml-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: #08090a;
  overflow-x: hidden;
}

::-webkit-scrollbar {
  display: none;
}

/* 🔥 फोटो डाउनलोड आणि लॉन्ग प्रेस बंद 🔥 */
img, .hero-image {
  pointer-events: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

.hero-section {
  position: relative;
  height: 320px;
  width: 100%;
  overflow: hidden;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
}

.hero-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.5) 70%, #08090a 100%);
}

.back-btn {
  position: absolute;
  top: 50px;
  left: 20px;
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  border: 1px solid rgba(255,255,255,0.2);
}

.service-title {
  position: absolute;
  bottom: 80px;
  left: 20px;
  right: 20px;
  z-index: 10;
  text-align: center;
}

.service-name {
  font-size: 28px;
  font-weight: 900;
  color: white;
  letter-spacing: -0.02em;
}

.service-category {
  display: inline-block;
  background: rgba(16,185,129,0.2);
  backdrop-filter: blur(10px);
  padding: 6px 16px;
  border-radius: 100px;
  font-size: 10px;
  font-weight: 700;
  color: #10b981;
  margin-top: 10px;
}

.logo-badge {
  position: absolute;
  top: 50px;
  right: 20px;
  z-index: 10;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
  padding: 8px 16px;
  border-radius: 100px;
}

.logo-badge h1 {
  font-size: 20px;
  font-weight: 900;
  color: white;
}

.logo-badge span {
  color: #10b981;
}

.content-card {
  background: #08090a;
  margin-top: -30px;
  border-radius: 30px 30px 0 0;
  padding: 24px 20px;
  position: relative;
  z-index: 5;
}

.info-section {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 20px;
}

.info-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.info-row:last-child {
  border-bottom: none;
}

.info-icon {
  width: 40px;
  height: 40px;
  background: rgba(16,185,129,0.1);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.info-label {
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  font-weight: 600;
  text-transform: uppercase;
}

.info-value {
  font-size: 14px;
  font-weight: 700;
  color: white;
  margin-top: 2px;
}

.price-tag {
  background: linear-gradient(135deg, rgba(16,185,129,0.15) 0%, rgba(16,185,129,0.05) 100%);
  border: 1px solid rgba(16,185,129,0.2);
  border-radius: 16px;
  padding: 16px 20px;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.price-label {
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
}

.price-amount {
  font-size: 32px;
  font-weight: 900;
  color: #10b981;
}

.description-box {
  background: rgba(255,255,255,0.02);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 24px;
}

.description-text {
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.7);
  line-height: 1.5;
}

.payment-alert {
  background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.15);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.payment-alert p {
  font-size: 11px;
  font-weight: 700;
  color: #ef4444;
}

.book-btn {
  width: 100%;
  background: #10b981;
  border: none;
  padding: 18px;
  border-radius: 18px;
  font-size: 16px;
  font-weight: 900;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: pointer;
  margin-bottom: 16px;
}

.book-btn:active {
  transform: scale(0.97);
}

.loading-screen {
  position: fixed;
  inset: 0;
  background: #08090a;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.spinner {
  width: 48px;
  height: 48px;
  border: 3px solid rgba(16,185,129,0.2);
  border-top-color: #10b981;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
</style>
</head>
<body>

<div id="loading-screen" class="loading-screen">
  <div class="spinner"></div>
  <p>Loading service...</p>
</div>

<div id="main-content" style="display:none;">
  <div class="hero-section">
    <img id="service-image" class="hero-image" src="" alt="Service">
    <div class="hero-overlay"></div>
    <div class="back-btn" onclick="window.history.back()">
      <i data-lucide="arrow-left" style="width:20px;height:20px;color:white;"></i>
    </div>
    <div class="logo-badge">
      <h1>Ride<span>Fix</span></h1>
    </div>
    <div class="service-title">
      <h1 id="service-name" class="service-name">Loading...</h1>
      <span id="service-category" class="service-category">DOORSTEP SERVICE</span>
    </div>
  </div>
  <div class="content-card">
    <div class="info-section">
      <div class="info-row">
        <div class="info-icon"><i data-lucide="clock" style="width:18px;height:18px;color:#10b981;"></i></div>
        <div><p class="info-label">Service Duration</p><p class="info-value">30-45 mins</p></div>
      </div>
      <div class="info-row">
        <div class="info-icon"><i data-lucide="shield-check" style="width:18px;height:18px;color:#10b981;"></i></div>
        <div><p class="info-label">Service Warranty</p><p class="info-value">7 Days Warranty</p></div>
      </div>
      <div class="info-row">
        <div class="info-icon"><i data-lucide="users" style="width:18px;height:18px;color:#10b981;"></i></div>
        <div><p class="info-label">Expert Technicians</p><p class="info-value">Certified & Experienced</p></div>
      </div>
    </div>
    <div class="price-tag">
      <span class="price-label">Service Booking Charges</span>
      <span class="price-amount"><small>₹</small> <span id="service-price">99</span></span>
    </div>
    <div class="description-box">
      <p id="service-description" class="description-text">Loading...</p>
    </div>
    <div class="payment-alert">
      <i data-lucide="credit-card" style="width:18px;height:18px;color:#ef4444;"></i>
      <p>⚠️ ONLY ONLINE PAYMENT ACCEPTED! Cash not accepted.</p>
    </div>
    <button class="book-btn" onclick="bookService()">
      <i data-lucide="calendar-check" style="width:20px;height:20px;"></i> BOOK SERVICE NOW
    </button>
    <p style="text-align:center;font-size:10px;color:rgba(255,255,255,0.15);margin-top:16px;">RideFix Premium • 24/7 Support</p>
  </div>
</div>
</body>
</html>
