<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RideFix</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
        background:#000000;
        height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        font-family:'Segoe UI',system-ui,sans-serif;
    }
    .splash-container{
        text-align:center;
        animation: fadeInUp 1.2s ease-out;
    }
    .logo-text{
        font-size:52px;
        font-weight:900;
        letter-spacing:-2px;
        background:linear-gradient(135deg,#ffffff 0%,#10b981 100%);
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent;
    }
    .logo-text span{
        color:#10b981;
        background:none;
        -webkit-background-clip:unset;
        background-clip:unset;
    }
    .tagline{
        color:rgba(255,255,255,0.4);
        font-size:10px;
        letter-spacing:3px;
        margin-top:10px;
        font-weight:600;
        text-transform:uppercase;
    }
    .loader{
        width:30px;
        height:30px;
        border:2px solid rgba(16,185,129,0.2);
        border-top-color:#10b981;
        border-radius:50%;
        animation:spin 0.8s linear infinite;
        margin:20px auto 0;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes fadeInUp{
        0%{opacity:0;transform:translateY(20px);}
        100%{opacity:1;transform:translateY(0);}
    }
</style>
</head>
<body>
    <div class="splash-container">
        <h1 class="logo-text">Ride<span>Fix</span></h1>
        <p class="tagline">Premium Vehicle Care</p>
        <div class="loader"></div>
    </div>

    <script>
        // 🔥 Login Check - Animation दरम्यानच 🔥
        setTimeout(() => {
            const userPhone = localStorage.getItem('ridefix_phone');
            if(userPhone && userPhone.length > 0) {
                window.location.href = 'index.html';
            } else {
                window.location.href = 'login.html';
            }
        }, 2500); // 2.5 सेकंद animation साठी
    </script>
</body>
</html>
