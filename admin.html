<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ridefix Admin - Service Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
      import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, orderBy, query } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDyAqz5_6-i7xIlPAdMUBhdVCZwV262Prw",
        authDomain: "ridefix-final.firebaseapp.com",
        projectId: "ridefix-final",
        storageBucket: "ridefix-final.appspot.com",
        messagingSenderId: "175554582400",
        appId: "1:175554582400:web:f40c9b80354d6963ab1365"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      async function uploadToImgBB(file) {
          const apiKey = "f862756aa196fea426ebce881b5cf9c5";
          const formData = new FormData();
          formData.append("image", file);
          try {
              const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
                  method: "POST",
                  body: formData
              });
              const data = await response.json();
              return data.success ? data.data.url : null;
          } catch (e) { return null; }
      }

      // Tab Switching Logic
      window.switchTab = (tabName) => {
          document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
          document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('bg-black', 'text-white'));
          
          document.getElementById(`${tabName}-tab`).classList.remove('hidden');
          document.getElementById(`${tabName}-btn`).classList.add('bg-black', 'text-white');
      };

      // Banner Management
      window.addBanner = async () => {
          const fileInput = document.getElementById('banner-file');
          const btn = document.getElementById('banner-add-btn');

          if (!fileInput.files[0]) { alert("Please select an image!"); return; }

          btn.innerText = "Uploading...";
          btn.disabled = true;

          const imageUrl = await uploadToImgBB(fileInput.files[0]);
          if (imageUrl) {
              await addDoc(collection(db, "banners"), {
                  image: imageUrl,
                  createdAt: serverTimestamp()
              });
              fileInput.value = "";
              alert("Banner Added!");
          }
          btn.innerText = "UPLOAD BANNER";
          btn.disabled = false;
      };

      window.deleteBanner = async (id) => {
          if(confirm("Delete this banner?")) await deleteDoc(doc(db, "banners", id));
      };

      // Services Logic with Position Number
      window.openModal = () => {
          document.getElementById('service-modal').classList.remove('hidden');
          // Auto suggest next position number
          document.getElementById('modal-position').value = window.nextPosition || 1;
      };
      window.closeModal = () => document.getElementById('service-modal').classList.add('hidden');

      window.submitService = async () => {
          const nameInput = document.getElementById('modal-name');
          const positionInput = document.getElementById('modal-position');
          const fileInput = document.getElementById('modal-file');
          const btn = document.getElementById('modal-submit-btn');

          if (!nameInput.value || !fileInput.files[0]) { 
              alert("Please enter service name and select an image!"); 
              return; 
          }
          
          if (!positionInput.value || isNaN(positionInput.value)) {
              alert("Please enter a valid position number (1, 2, 3...)"); 
              return;
          }

          btn.innerText = "Uploading...";
          btn.disabled = true;

          const imageUrl = await uploadToImgBB(fileInput.files[0]);
          if (imageUrl) {
              await addDoc(collection(db, "services"), {
                  name: nameInput.value,
                  image: imageUrl,
                  position: parseInt(positionInput.value),
                  createdAt: serverTimestamp()
              });
              
              nameInput.value = ""; 
              positionInput.value = "";
              fileInput.value = ""; 
              closeModal();
              alert("Service Added Successfully!");
          }
          btn.innerText = "ADD SERVICE"; 
          btn.disabled = false;
      };
      
      // Update Service Position
      window.updatePosition = async (id, newPosition) => {
          if (!newPosition || isNaN(newPosition)) return;
          await updateDoc(doc(db, "services", id), { position: parseInt(newPosition) });
          alert("Position updated!");
      };

      // Realtime Listeners - Services sorted by position
      const servicesQuery = query(collection(db, "services"), orderBy("position", "asc"));
      onSnapshot(servicesQuery, (snap) => {
          const list = document.getElementById("admin-list");
          list.innerHTML = "";
          let maxPosition = 0;
          
          snap.forEach(s => {
              const data = s.data();
              const displayName = data.name || "No Name";
              const position = data.position || 999;
              if (position > maxPosition) maxPosition = position;
              
              list.innerHTML += `
              <div class="bg-white p-4 rounded-3xl shadow-sm mb-4 border">
                  <div class="flex items-center gap-4">
                      <img src="${data.image}" class="w-16 h-16 rounded-2xl object-cover bg-slate-50">
                      <div class="flex-1 min-w-0">
                          <div class="flex items-center gap-2">
                              <span class="bg-emerald-100 text-emerald-700 text-[10px] font-black px-2 py-0.5 rounded-full">#${position}</span>
                              <p class="font-bold text-slate-800 text-sm truncate">${displayName}</p>
                          </div>
                      </div>
                      <button onclick="if(confirm('Delete this service?')) deleteDoc(doc(db,'services','${s.id}'))" class="text-red-500 font-bold px-3 active:scale-90 transition">X</button>
                  </div>
                  <div class="mt-3 pt-3 border-t border-slate-100 flex items-center gap-2">
                      <span class="text-[10px] font-bold text-slate-400">Change Position:</span>
                      <input type="number" id="pos-${s.id}" value="${position}" class="w-16 px-2 py-1 border rounded-lg text-xs text-center" min="1">
                      <button onclick="updatePosition('${s.id}', document.getElementById('pos-${s.id}').value)" class="bg-slate-800 text-white px-3 py-1 rounded-lg text-[10px] font-bold">UPDATE</button>
                  </div>
              </div>`;
          });
          
          window.nextPosition = maxPosition + 1;
      });

      onSnapshot(collection(db, "banners"), (snap) => {
          const list = document.getElementById("banner-list");
          list.innerHTML = "";
          snap.forEach(b => {
              list.innerHTML += `<div class="relative mb-4">
                  <img src="${b.data().image}" class="w-full h-32 object-cover rounded-3xl border shadow-sm">
                  <button onclick="deleteBanner('${b.id}')" class="absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full font-bold shadow-lg">X</button>
              </div>`;
          });
      });
      
      window.db = db; 
      window.doc = doc; 
      window.deleteDoc = deleteDoc;
      window.updateDoc = updateDoc;
    </script>
</head>
<body class="bg-slate-50 p-6 font-['Plus_Jakarta_Sans']">
    <div class="max-w-[450px] mx-auto">
        <h1 class="text-2xl font-black tracking-tighter uppercase mb-6">Ridefix Admin</h1>

        <div class="flex gap-2 bg-slate-200 p-1 rounded-2xl mb-8">
            <button id="services-btn" onclick="switchTab('services')" class="tab-btn flex-1 py-3 rounded-xl font-black text-xs bg-black text-white transition-all">SERVICES</button>
            <button id="banners-btn" onclick="switchTab('banners')" class="tab-btn flex-1 py-3 rounded-xl font-black text-xs transition-all">BANNERS</button>
        </div>

        <div id="services-tab" class="tab-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="font-black text-slate-400 text-xs tracking-widest uppercase">Service List (by Position)</h2>
                <button onclick="openModal()" class="bg-emerald-600 text-white px-5 py-2.5 rounded-xl text-[10px] font-black shadow-lg shadow-emerald-100">+ NEW</button>
            </div>
            <div id="admin-list"></div>
            <p class="text-[10px] text-slate-400 text-center mt-4">Services will appear in order of Position Number (1,2,3...)</p>
        </div>

        <div id="banners-tab" class="tab-content hidden">
            <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 mb-8">
                <h3 class="font-black text-sm mb-4 tracking-tight">Upload New Banner</h3>
                <input id="banner-file" type="file" accept="image/*" class="w-full text-xs mb-4 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-slate-100 file:font-bold">
                <button id="banner-add-btn" onclick="addBanner()" class="w-full bg-black text-white py-4 rounded-2xl font-black text-xs tracking-widest">UPLOAD BANNER</button>
            </div>
            <h2 class="font-black text-slate-400 text-xs tracking-widest uppercase mb-4 ml-2">Active Banners</h2>
            <div id="banner-list"></div>
        </div>
    </div>

    <!-- Add Service Modal -->
    <div id="service-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[2000] flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-[400px] rounded-[2.5rem] p-8 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black tracking-tight">Add New Service</h2>
                <button onclick="closeModal()" class="text-slate-400 font-bold">X</button>
            </div>
            
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-wider ml-1">Service Name (English)</label>
            <input id="modal-name" type="text" placeholder="e.g. Bike Repair, Home Service" class="w-full bg-slate-100 p-4 rounded-2xl mb-4 outline-none font-bold text-sm border focus:border-emerald-500 transition">
            
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-wider ml-1">Position Number</label>
            <input id="modal-position" type="number" placeholder="1, 2, 3..." class="w-full bg-slate-100 p-4 rounded-2xl mb-4 outline-none font-bold text-sm border focus:border-emerald-500 transition" min="1">
            <p class="text-[9px] text-slate-400 -mt-3 mb-3 ml-1">Services will appear in this order (smaller number = higher priority)</p>
            
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-wider ml-1">Service Image</label>
            <input id="modal-file" type="file" accept="image/*" class="w-full text-xs mb-6 mt-1 file:bg-slate-900 file:text-white file:px-4 file:py-2 file:rounded-xl file:border-0 file:font-bold">
            
            <button id="modal-submit-btn" onclick="submitService()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-emerald-100 active:scale-95 transition">ADD SERVICE</button>
        </div>
    </div>
</body>
</html>
