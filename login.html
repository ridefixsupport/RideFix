<style>
* { box-sizing: border-box; }

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: #08090a;
  overflow: hidden;
  width: 100%;
  height: 100%;
}

/* inputs tap honyasathi */
input, select, button, textarea, label {
  -webkit-user-select: text !important;
  user-select: text !important;
  touch-action: manipulation;
}

button {
  -webkit-user-select: none !important;
  user-select: none !important;
}

::-webkit-scrollbar { display: none; }

@keyframes slideDownPhoto {
  0% { transform: translateY(-100%); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}
.animate-slide-down-photo {
  animation: slideDownPhoto 1.5s cubic-bezier(0.16,1,0.3,1) forwards;
  opacity: 0;
}

@keyframes fadeInForm {
  0% { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}
.animate-fade-in-form {
  animation: fadeInForm 1.5s cubic-bezier(0.16,1,0.3,1) forwards;
  opacity: 0;
}

@keyframes neonPulse {
  0%, 100% { box-shadow: 0 0 10px rgba(16,185,129,0.15); }
  50% { box-shadow: 0 0 22px rgba(16,185,129,0.4); }
}
.animate-pulse-btn { animation: neonPulse 3s ease-in-out infinite; }

/* LOGIN SCREEN */
#screen-login {
  position: fixed;
  inset: 0;
  overflow-y: auto;
  z-index: 10;
  background: #08090a;
  display: flex;
  flex-direction: column;
}

/* PROFILE SCREEN */
#screen-profile {
  position: fixed;
  inset: 0;
  overflow-y: auto;
  z-index: 10;
  background: #08090a;
  padding: 40px 24px 60px 24px;
  display: none;
}

.angled-header {
  clip-path: polygon(0 0, 100% 0, 100% 85%, 0% 100%);
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  flex-shrink: 0;
}

.glass-input {
  background: rgba(255,255,255,0.04) !important;
  color: white;
  border: 1px solid rgba(255,255,255,0.08);
  transition: all 0.3s ease;
  width: 100%;
  font-family: 'Plus Jakarta Sans', sans-serif;
}
.glass-input:focus {
  border-color: #10b981;
  box-shadow: 0 0 12px rgba(16,185,129,0.2);
  outline: none;
}
.glass-input option {
  background: #1e293b;
  color: white;
}

.logo-glow { text-shadow: 0 0 15px rgba(16,185,129,0.4); }

.india-badge {
  background: rgba(255,255,255,0.06);
  color: #34d399;
  border: 1px solid rgba(255,255,255,0.08);
  border-top-left-radius: 1rem;
  border-bottom-left-radius: 1rem;
  font-weight: bold;
  font-size: 14px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  flex-shrink: 0;
}

.photo-ring {
  width: 100px; height: 100px;
  border-radius: 50%;
  border: 3px solid #10b981;
  box-shadow: 0 0 20px rgba(16,185,129,0.3);
  object-fit: cover;
  cursor: pointer;
  display: block;
}

.custom-select-wrapper { position: relative; }
.custom-select-wrapper::after {
  content: '▾';
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: #10b981;
  pointer-events: none;
  font-size: 14px;
}
select.glass-input {
  appearance: none;
  -webkit-appearance: none;
  padding: 14px 40px 14px 44px;
  border-radius: 1rem;
  cursor: pointer;
}

.step-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  transition: all 0.3s ease;
}
.step-dot.active {
  background: #10b981;
  box-shadow: 0 0 8px rgba(16,185,129,0.6);
  width: 24px;
  border-radius: 4px;
}
.step-dot.done { background: #10b981; }
</style>

  </div>

</div>

    success: "color:#10b981;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);",
    error: "color:#ef4444;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);",
    loading: "color:#fbbf24;background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.2);"
  };
  el.innerText = msg;
  el.style.cssText = "display:block;font-size:12px;font-weight:700;padding:12px;border-radius:12px;margin-top:8px;" + styles[type];
}

function showScreen(id) {
  document.getElementById('screen-login').style.display = 'none';
  document.getElementById('screen-profile').style.display = 'block';
  initDropdowns();
  setTimeout(() => lucide.createIcons(), 50);
}

// ===== LOGIN =====
document.getElementById('auth-form').addEventListener('submit', function(e) {
  e.preventDefault();
  if (!isOtpSent) sendOTPLogic();
  else verifyOTPLogic();
});

function sendOTPLogic() {
  let phone = document.getElementById('login-mobile').value.trim();
  if (phone.startsWith('+91')) phone = phone.replace('+91','');
  else if (phone.startsWith('91') && phone.length > 10) phone = phone.substring(2);
  if (phone.length !== 10 || isNaN(phone)) {
    showStatus('status-message','✕ Please enter a valid 10-digit mobile number.','error'); return;
  }
  currentPhone = phone;
  showStatus('status-message','🔄 Requesting OTP...','loading');
  fetch(`https://2factor.in/API/V1/${apiKey2Factor}/SMS/+91${phone}/AUTOGEN/OTPSMS`)
    .then(r => r.json())
    .then(data => {
      if (data.Status === "Success") {
        sessionID = data.Details;
        isOtpSent = true;
        document.getElementById('mobile-field-wrapper').style.display = 'none';
        document.getElementById('otp-field-wrapper').classList.remove('hidden');
        document.getElementById('display-number').innerText = "Sent to: +91 " + phone;
        document.getElementById('login-otp').focus();
        showStatus('status-message','✓ OTP Sent Successfully!','success');
        document.getElementById('main-auth-btn').innerText = "VERIFY & LOGIN";
        setTimeout(() => lucide.createIcons(), 50);
      } else {
        showStatus('status-message','✕ Failed to send OTP. Please try again.','error');
      }
    })
    .catch(() => showStatus('status-message','✕ Network error. Try again.','error'));
}

function verifyOTPLogic() {
  const code = document.getElementById('login-otp').value.trim();
  if (!code || code.length < 4) {
    showStatus('status-message','✕ Please enter the OTP.','error'); return;
  }
  showStatus('status-message','🔄 Verifying...','loading');
  fetch(`https://2factor.in/API/V1/${apiKey2Factor}/SMS/VERIFY/${sessionID}/${code}`)
    .then(r => r.json())
    .then(async data => {
      if (data.Status === "Success") {
        showStatus('status-message','✓ OTP Verified! Checking account...','success');
        await checkFirebaseUser(currentPhone);
      } else {
        showStatus('status-message','✕ Invalid OTP! Please enter correct code.','error');
        document.getElementById('login-otp').focus();
      }
    })
    .catch(() => showStatus('status-message','✕ Verification failed. Check connection.','error'));
}

// ===== FIREBASE CHECK =====
async function checkFirebaseUser(phone) {
  try {
    const db = window._db;
    const docRef = window._doc(db, "users", phone);
    const docSnap = await window._getDoc(docRef);
    localStorage.setItem('ridefix_phone', phone);
    if (docSnap.exists()) {
      showStatus('status-message','✓ Welcome back! Redirecting...','success');
      setTimeout(() => { window.location.href = "index.html"; }, 1200);
    } else {
      showStatus('status-message','✓ New account! Setting up profile...','success');
      setTimeout(() => { showScreen('screen-profile'); }, 800);
    }
  } catch(err) {
    showStatus('status-message','✕ Error checking account. Try again.','error');
    console.error(err);
  }
}

// ===== OTP HELPERS =====
function editNumber() {
  isOtpSent = false;
  document.getElementById('login-otp').value = "";
  document.getElementById('otp-field-wrapper').classList.add('hidden');
  document.getElementById('mobile-field-wrapper').style.display = 'flex';
  document.getElementById('status-message').style.display = 'none';
  document.getElementById('main-auth-btn').innerText = "REQUEST FOR OTP";
  document.getElementById('login-mobile').focus();
  setTimeout(() => lucide.createIcons(), 50);
}

function resendOTP() {
  const btn = document.getElementById('resend-btn');
  btn.disabled = true;
  btn.innerText = "Resending...";
  fetch(`https://2factor.in/API/V1/${apiKey2Factor}/SMS/+91${currentPhone}/AUTOGEN/OTPSMS`)
    .then(r => r.json())
    .then(data => {
      if (data.Status === "Success") {
        sessionID = data.Details;
        showStatus('status-message','✓ New OTP Sent!','success');
      } else {
        showStatus('status-message','✕ Unable to resend. Try again.','error');
      }
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = `Didn't get code? <span style="color:#10b981;">Resend OTP</span>`;
      }, 5000);
    })
    .catch(() => {
      btn.disabled = false;
      btn.innerHTML = `Didn't get code? <span style="color:#10b981;">Resend OTP</span>`;
    });
}

// ===== PHOTO =====
function handlePhotoChange(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    selectedPhotoBase64 = e.target.result;
    document.getElementById('profile-preview').src = selectedPhotoBase64;
  };
  reader.readAsDataURL(file);
}

// ===== DROPDOWNS =====
function initDropdowns() {
  const distSel = document.getElementById('district-select');
  if (distSel.options.length <= 1) {
    Object.keys(maharashtraData).sort().forEach(d => {
      const opt = document.createElement('option');
      opt.value = d; opt.textContent = d;
      distSel.appendChild(opt);
    });
  }
  const compSel = document.getElementById('bike-company');
  if (compSel.options.length <= 1) {
    Object.keys(bikeData).sort().forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      compSel.appendChild(opt);
    });
  }
}

function onDistrictChange() {
  const dist = document.getElementById('district-select').value;
  const talSel = document.getElementById('taluka-select');
  talSel.innerHTML = '<option value="">Select Taluka</option>';
  document.getElementById('village-wrapper').style.display = 'none';
  if (!dist) { talSel.disabled = true; return; }
  (maharashtraData[dist] || []).sort().forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    talSel.appendChild(opt);
  });
  talSel.disabled = false;
}

function onTalukaChange() {
  const tal = document.getElementById('taluka-select').value;
  document.getElementById('village-wrapper').style.display = tal ? 'block' : 'none';
}

function onCompanyChange() {
  const company = document.getElementById('bike-company').value;
  const modelSel = document.getElementById('bike-model');
  modelSel.innerHTML = '<option value="">Select Model</option>';
  document.getElementById('bike-card').style.display = 'none';
  if (!company) { modelSel.disabled = true; return; }
  (bikeData[company] || []).forEach(m => {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    modelSel.appendChild(opt);
  });
  modelSel.disabled = false;
}

function onModelChange() {
  const company = document.getElementById('bike-company').value;
  const model = document.getElementById('bike-model').value;
  if (model) {
    document.getElementById('bike-card').style.display = 'block';
    document.getElementById('bike-card-text').textContent = company + " " + model;
  } else {
    document.getElementById('bike-card').style.display = 'none';
  }
}

// ===== STEP NAV =====
function goToStep2() {
  const name = document.getElementById('user-name').value.trim();
  const district = document.getElementById('district-select').value;
  const taluka = document.getElementById('taluka-select').value;
  if (!name) { alert("Please enter your full name."); return; }
  if (!district) { alert("Please select your district."); return; }
  if (!taluka) { alert("Please select your taluka."); return; }
  document.getElementById('step-1').style.display = 'none';
  document.getElementById('step-2').style.display = 'block';
  document.getElementById('step1-dot').classList.remove('active');
  document.getElementById('step1-dot').classList.add('done');
  document.getElementById('step2-dot').classList.add('active');
  document.getElementById('screen-profile').scrollTop = 0;
  setTimeout(() => lucide.createIcons(), 50);
}

function goToStep1() {
  document.getElementById('step-2').style.display = 'none';
  document.getElementById('step-1').style.display = 'block';
  document.getElementById('step2-dot').classList.remove('active');
  document.getElementById('step1-dot').classList.remove('done');
  document.getElementById('step1-dot').classList.add('active');
  document.getElementById('screen-profile').scrollTop = 0;
}

// ===== COMPLETE PROFILE =====
async function completeProfile() {
  const company = document.getElementById('bike-company').value;
  const model = document.getElementById('bike-model').value;
  if (!company) { alert("Please select your bike brand."); return; }
  if (!model) { alert("Please select your bike model."); return; }

  showStatus('profile-status','🔄 Saving your profile...','loading');

  try {
    let photoURL = "https://ui-avatars.com/api/?name=" +
      encodeURIComponent(document.getElementById('user-name').value) +
      "&background=1e293b&color=10b981&size=200&bold=true&rounded=true";

    if (selectedPhotoBase64) {
      showStatus('profile-status','🔄 Uploading photo...','loading');
      const base64Data = selectedPhotoBase64.split(',')[1];
      const formData = new FormData();
      formData.append('key', imgbbKey);
      formData.append('image', base64Data);
      const imgRes = await fetch('https://api.imgbb.com/1/upload', { method:'POST', body:formData });
      const imgData = await imgRes.json();
      if (imgData.success) {
        photoURL = imgData.data.url;
      }
    }

    showStatus('profile-status','🔄 Saving to database...','loading');

    const userData = {
      phone: "+91" + currentPhone,
      name: document.getElementById('user-name').value.trim(),
      district: document.getElementById('district-select').value,
      taluka: document.getElementById('taluka-select').value,
      village: document.getElementById('village-input').value.trim(),
      bikeCompany: company,
      bikeModel: model,
      photoURL: photoURL,
      createdAt: new Date().toISOString(),
      isProfileComplete: true
    };

    await window._setDoc(window._doc(window._db, "users", currentPhone), userData);
    showStatus('profile-status','✓ Profile saved! Welcome to RideFix! 🎉','success');
    setTimeout(() => { window.location.href = "index.html"; }, 1500);

  } catch(err) {
    showStatus('profile-status','✕ Failed to save. Try again.','error');
    console.error(err);
  }
}
